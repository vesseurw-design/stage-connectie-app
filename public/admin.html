<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Stage Connectie App</title>
    <link rel="icon" type="image/png" href="icon-v3.png">
    <link rel="apple-touch-icon" href="icon-v3.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* ============ PRINT STYLES ============ */
        @media print {
            body * { visibility: hidden; }
            #print-section, #print-section * { visibility: visible; }
            #print-section {
                position: absolute;
                top: 0; left: 0;
                width: 100%;
                padding: 0px;
                background: white;
            }
            .no-print { display: none !important; }
            /* Totaaloverzicht tabel */
            .print-table {
                width: 100%;
                border-collapse: collapse;
                font-size: 10px;
                margin-top: 15px;
            }
            .print-table th, .print-table td {
                border: 1px solid #94a3b8;
                padding: 6px 8px;
                text-align: center;
            }
            .print-table th { background: #f8fafc; font-weight: 700; color: #1e293b; border-bottom: 2px solid #64748b; }
            .print-table td:first-child, .print-table th:first-child { text-align: left; min-width: 130px; }
            .print-table td:nth-child(2), .print-table th:nth-child(2) { text-align: left; min-width: 120px; }
            /* Losse leerlingformulieren */
            .student-form-card {
                page-break-after: always;
                padding: 10px 0;
                margin-bottom: 0;
            }
            .student-form-card:last-child { page-break-after: auto; }
            .student-form-table {
                width: 100%;
                border-collapse: collapse;
                font-size: 11px;
                margin-top: 15px;
            }
            .student-form-table th, .student-form-table td {
                border: 1px solid #94a3b8;
                padding: 7px 10px;
            }
            .student-form-table th { background: #f8fafc; font-weight: 700; text-align: left; color: #1e293b; border-bottom: 2px solid #64748b; }
            .student-form-table td { min-height: 36px; }
            .form-header { margin-bottom: 12px; padding-bottom: 8px; }
        }
        @media screen {
            #print-section { display: none; }
        }
    </style>
</head>

<body class="bg-gray-50">

    <!-- ============ NAVIGATIE ============ -->
    <header class="bg-white shadow-sm border-b border-gray-200 no-print">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">

                    Studenten Beheer
                </a>

                <a href="admin-begeleiders-v3.html"

            <strong style="font-size:14px; color:#374151; margin-right:8px;" id="print-mode-label">Overzicht</strong>

                <label style="font-size:12px; color:#4b5563;">Van</label>
                <input type="date" id="print-start-date" style="border:1px solid #d1d5db; padding:4px 6px; border-radius:6px; font-size:12px; outline:none;">
                <label style="font-size:12px; color:#4b5563;">Tot</label>
                <input type="date" id="print-end-date" style="border:1px solid #d1d5db; padding:4px 6px; border-radius:6px; font-size:12px; outline:none;">
                
                <span style="font-size:12px; font-weight:600; color:#4b5563; margin-left:8px;">Leerling:</span>

    <!-- ============ SCRIPTS ============ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./static/js/config.js"></script>
    <script>
        const SUPABASE_URL = window.SUPABASE_URL || 'https://vdeipnqyesduiohxvuvu.supabase.co';
        const SUPABASE_KEY = window.SUPABASE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZkZWlwbnF5ZXNkdWlvaHh2dXZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc1MjY5NTEsImV4cCI6MjA4MzEwMjk1MX0.IknEZ-GQvspcppJxLR00ayBDq1DbL0HiUKy9RDb59DU';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allAttendance = [];
        let companies = [];
        let students = [];
        let supervisors = [];
        let currentUser = null;

        // Modal state
        let editingStudentId = null;
        let editingDate = null;
        let editingExistingRecord = null;
        let selectedModalStatus = '';

        // ========================
        // AUTH
        // ========================
        function handleLogout() {
            db.auth.signOut();
            localStorage.removeItem('stageconnect_admin_session');
            localStorage.removeItem('admin_email');
            localStorage.removeItem('admin_name');
            localStorage.removeItem('auth_user_id');
            window.location.href = 'admin-login.html';
        }

        async function checkAuth() {
            const { data: { session }, error } = await db.auth.getSession();
            if (error || !session) {
                localStorage.removeItem('stageconnect_admin_session');
                localStorage.removeItem('admin_email');
                localStorage.removeItem('admin_name');
                localStorage.removeItem('auth_user_id');
                window.location.href = 'admin-login.html';
                return false;
            }
            currentUser = session.user;
            if (currentUser.user_metadata?.role !== 'admin') {
                alert('Je hebt geen admin rechten!');
                localStorage.removeItem('stageconnect_admin_session');
                localStorage.removeItem('admin_email');
                localStorage.removeItem('admin_name');
                localStorage.removeItem('auth_user_id');
                window.location.href = 'admin-login.html';
                return false;
            }
            return true;
        }

        // ========================
        // INIT
        // ========================
        async function init() {
            const isAuthenticated = await checkAuth();
            if (!isAuthenticated) return;

            await Promise.all([loadCompanies(), loadStudents(), loadAttendance(), loadSupervisors()]);
            setupRealtimeSubscription();
            setupFilters();
            updateDashboard();
        }

        // ========================
        // DATA LADEN
        // ========================
        async function loadCompanies() {
            const { data } = await db.from('Bedrijven').select('*');
            companies = data || [];
            const sel = document.getElementById('filter-company');
            companies.forEach(c => {
                sel.innerHTML += `<option value="${c.id}">${c.company_name}</option>`;
            });
        }

        async function loadStudents() {
            const { data } = await db.from('Students').select('*');
            students = data || [];
        }

        async function loadAttendance() {
            const { data } = await db.from('Attendance').select('*').order('date', { ascending: false });
            allAttendance = data || [];
        }

        async function loadSupervisors() {
            const { data } = await db.from('stagebegeleiders').select('*');
            supervisors = data || [];
        }

        function setupRealtimeSubscription() {
            db.channel('public:Attendance')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'Attendance' }, () => {
                    loadAttendance().then(updateDashboard);
                })
                .subscribe();
        }

        function setupFilters() {
            ['filter-date', 'filter-company', 'filter-status', 'show-missing'].forEach(id => {
                document.getElementById(id).addEventListener('change', updateDashboard);
            });
            document.getElementById('filter-date').valueAsDate = new Date();
        }

        // ========================
        // DASHBOARD UPDATEN
        // ========================
        function updateDashboard() {
            const dateFilter = document.getElementById('filter-date').value;
            const companyFilter = document.getElementById('filter-company').value;
            const statusFilter = document.getElementById('filter-status').value;
            const showMissing = document.getElementById('show-missing').checked;

            // Bepaal welke leerlingen op deze dag een stagegdag hebben
            const dayCode = getDayCode(dateFilter);
            const scheduledStudents = students.filter(s =>
                !s.scheduled_days || s.scheduled_days.length === 0 || s.scheduled_days.includes(dayCode)
            );

            // Bestaande records op deze datum
            let existingOnDate = allAttendance.filter(a => a.date === dateFilter);

            // Ontbrekende leerlingen (geen record voor deze datum)
            const missingStudents = scheduledStudents.filter(s =>
                !existingOnDate.find(a => a.student_id === s.id)
            );

            // Filter bestaande records
            let filtered = existingOnDate;
            if (companyFilter) {
                filtered = filtered.filter(a => {
                    const st = students.find(s => s.id === a.student_id);
                    return st && st.company_id === companyFilter;
                });
            }
            if (statusFilter && statusFilter !== 'missing') {
                filtered = filtered.filter(a => a.student_status === statusFilter);
            }

            // Stats
            const allOnDate = allAttendance.filter(a => a.date === dateFilter);
            updateStats(allOnDate, missingStudents.length);

            // Render
            if (statusFilter === 'missing') {
                renderTable([], showMissing ? missingStudents : [], dateFilter, companyFilter);
            } else {
                renderTable(filtered, showMissing ? missingStudents.filter(s =>
                    !companyFilter || s.company_id === companyFilter
                ) : [], dateFilter, companyFilter);
            }
        }

        function getDayCode(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            // 0=Zo, 1=Ma, 2=Di, 3=Wo, 4=Do, 5=Vr, 6=Za
            const map = ['', 'Ma', 'Di', 'Wo', 'Do', 'Vr', ''];
            return map[d.getDay()] || '';
        }

        function updateStats(attendance, missingCount) {
            document.getElementById('stat-present').textContent = attendance.filter(a => a.student_status === 'present').length;
            document.getElementById('stat-absent').textContent = attendance.filter(a => a.student_status === 'absent').length;
            document.getElementById('stat-sick').textContent = attendance.filter(a => a.student_status === 'sick').length;
            document.getElementById('stat-late').textContent = attendance.filter(a => a.student_status === 'late').length;
            document.getElementById('stat-missing').textContent = missingCount;
        }

        function renderTable(attendance, missingStudents, dateFilter, companyFilter) {
            const tbody = document.getElementById('attendance-table-body');
            tbody.innerHTML = '';

            const statusClasses = {
                'present': 'bg-green-100 text-green-800',
                'absent': 'bg-red-100 text-red-800',
                'sick': 'bg-orange-100 text-orange-800',
                'late': 'bg-yellow-100 text-yellow-800'
            };
            const statusLabels = {
                'present': '✅ Aanwezig',
                'absent': '❌ Afwezig',
                'sick': '🤒 Ziek',
                'late': '⏱️ Te laat'
            };

            let rowsAdded = 0;

            // Ingevulde records
            attendance.forEach(record => {
                const student = students.find(s => s.id === record.student_id);
                const company = companies.find(c => c.id === (student?.company_id));
                const studentName = student ? student.name : `ID: ${record.student_id}`;
                const companyName = company ? company.company_name : '–';
                const studentStatusHtml = record.student_status ? `
                    <span class="px-2 py-0.5 inline-flex items-center gap-1 text-[11px] font-semibold rounded-full ${statusClasses[record.student_status] || 'bg-gray-100 text-gray-600'}">
                        🎓 Student: ${statusLabels[record.student_status] || record.student_status}
                    </span>
                ` : '';

                const employerStatusHtml = record.status ? `
                    <span class="px-2 py-0.5 inline-flex items-center gap-1 text-[11px] font-semibold rounded-full ${statusClasses[record.status] || 'bg-gray-100 text-gray-600'}">
                        🏢 Werkgever: ${statusLabels[record.status] || record.status}${record.status === 'late' && record.minutes_late > 0 ? ` (${record.minutes_late}m)` : ''}
                    </span>
                ` : '';

                const statusCellContent = `
                    <div class="flex flex-col gap-1 items-start">
                        ${studentStatusHtml}
                        ${employerStatusHtml}
                        ${(!studentStatusHtml && !employerStatusHtml) ? '<span class="text-gray-400 text-xs italic">Geen invoer</span>' : ''}
                    </div>
                `;

                const hours = record.student_hours > 0 && record.student_status !== 'absent'
                    ? `${record.student_hours} uur` : '–';

                tbody.innerHTML += `

        // ========================
        // EDIT MODAL
        // ========================
        function openEditModal(studentId, date, hasExistingRecord) {
            editingStudentId = studentId;
            editingDate = date;
            selectedModalStatus = '';

            const student = students.find(s => s.id === studentId);
            document.getElementById('modal-student-name').textContent = student ? student.name : 'Student';

            const dateObj = new Date(date);
            document.getElementById('modal-date-label').textContent =
                dateObj.toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

            // Reset knoppen
            resetModalButtons();

            // Werkgever info laden
            const record = allAttendance.find(a => a.student_id === studentId && a.date === date);
            const empInfoBox = document.getElementById('modal-employer-info');
            const empStatusText = document.getElementById('modal-employer-status-text');
            const statusLabelsRaw = { present: 'Aanwezig', absent: 'Afwezig', sick: 'Ziek', late: 'Te laat' };
            if (record && record.status) {
                const empLabel = statusLabelsRaw[record.status] || record.status;
                const lateStr = (record.status === 'late' && record.minutes_late > 0) ? ` (${record.minutes_late} min te laat)` : '';
                empStatusText.innerHTML = `<span class="font-bold text-blue-900">${empLabel}</span>${lateStr}`;
                empInfoBox.classList.remove('hidden');
            } else {
                empStatusText.textContent = 'Nog geen invoer';
                empInfoBox.classList.add('hidden');
            }

            if (hasExistingRecord) {
                editingExistingRecord = record;
                if (editingExistingRecord) {
                    selectModalStatus(editingExistingRecord.student_status);
                    document.getElementById('modal-hours').value = editingExistingRecord.student_hours || 0;
                }
                document.getElementById('modal-delete-btn').classList.remove('hidden');
            } else {
                editingExistingRecord = null;
                document.getElementById('modal-hours').value = 8;
                document.getElementById('modal-delete-btn').classList.add('hidden');
            }

            document.getElementById('modal-note').value = '';
            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.add('hidden');
            editingStudentId = null;
            editingDate = null;
            editingExistingRecord = null;
            selectedModalStatus = '';
        }

        function resetModalButtons() {
            ['present', 'absent', 'sick', 'late'].forEach(s => {
                const btn = document.getElementById(`modal-btn-${s}`);
                btn.className = 'modal-status-btn flex items-center gap-2 p-3 rounded-xl border-2 border-gray-200 text-gray-600 font-medium text-sm transition hover:border-gray-300 hover:bg-gray-50';
            });
        }

        function selectModalStatus(status) {
            selectedModalStatus = status;
            resetModalButtons();

            const colors = {
                present: 'border-green-400 bg-green-50 text-green-700',
                absent: 'border-red-400 bg-red-50 text-red-700',
                sick: 'border-orange-400 bg-orange-50 text-orange-700',
                late: 'border-yellow-400 bg-yellow-50 text-yellow-700'
            };
            const btn = document.getElementById(`modal-btn-${status}`);
            btn.className = `modal-status-btn flex items-center gap-2 p-3 rounded-xl border-2 ${colors[status]} font-bold text-sm transition scale-[1.02]`;

            // Verberg uren bij afwezig
            const hoursRow = document.getElementById('modal-hours-row');
            if (status === 'absent') {
                hoursRow.classList.add('hidden');
                document.getElementById('modal-hours').value = 0;
            } else {
                hoursRow.classList.remove('hidden');
                if (document.getElementById('modal-hours').value == 0) {
                    document.getElementById('modal-hours').value = 8;
                }
            }
        }

        async function saveAttendance() {
            if (!selectedModalStatus) {
                alert('Kies eerst een status.');
                return;
            }
            if (!editingStudentId || !editingDate) return;

            const hours = parseFloat(document.getElementById('modal-hours').value) || 0;

            const record = {
                student_id: editingStudentId,
                date: editingDate,
                student_status: selectedModalStatus,
                student_hours: selectedModalStatus === 'absent' ? 0 : hours,
                updated_at: new Date().toISOString()
            };

            const { error } = await db.from('Attendance').upsert(record, { onConflict: 'student_id,date' });

            if (error) {
                alert('Fout bij opslaan: ' + error.message);
                return;
            }

            closeEditModal();
            await loadAttendance();
            updateDashboard();
        }

        async function deleteAttendance() {
            if (!editingStudentId || !editingDate) return;
            if (!confirm('Weet je zeker dat je deze registratie wilt verwijderen?')) return;

            const { error } = await db.from('Attendance')
                .delete()
                .eq('student_id', editingStudentId)
                .eq('date', editingDate);

            if (error) {
                alert('Fout bij verwijderen: ' + error.message);
                return;
            }

            closeEditModal();
            await loadAttendance();
            updateDashboard();
        }

        let currentPrintMode = 'overview';

        function getDaysInRange(startDateStr, endDateStr) {
            const start = new Date(startDateStr);
            const end = new Date(endDateStr);
            const days = [];
            let current = new Date(start);
            let count = 0;
            while (current <= end && count < 200) {
                const dayNum = current.getDay();
                if (dayNum >= 1 && dayNum <= 5) {
                    const d = new Date(current);
                    days.push({
                        label: d.toLocaleDateString('nl-NL', { weekday: 'short', day: 'numeric', month: 'numeric' }),
                        fullLabel: d.toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long' }),
                        dateStr: d.toISOString().split('T')[0],
                        dayCode: ['', 'Ma', 'Di', 'Wo', 'Do', 'Vr', ''][d.getDay()]
                    });
                }
                current.setDate(current.getDate() + 1);
                count++;
            }
            return days;
        }

            const current = dateFilter ? new Date(dateFilter) : new Date();
            const day = current.getDay();
            const monday = new Date(current);
            monday.setDate(current.getDate() - day + (day === 0 ? -6 : 1));
            const friday = new Date(monday);
            friday.setDate(monday.getDate() + 4);

            document.getElementById('print-start-date').value = monday.toISOString().split('T')[0];
            document.getElementById('print-end-date').value = friday.toISOString().split('T')[0];

                    opt.value = s.id;
                    opt.textContent = s.name;

                                <div>

                                    <p style="font-size:11px; color:#475569; margin:4px 0 0; font-weight:500;">Officiële samenvatting ten behoeve van het examendossier</p>
                                </div>
                                <div style="text-align:right;">
                                    <img src="${window.SCHOOL_LOGO}" onerror="this.style.display='none'; document.getElementById('school-text-fallback-${student.id}-summary').style.display='block';" style="max-height:48px; max-width:180px; object-fit:contain; display:block; margin-left:auto;">
                                    <span id="school-text-fallback-${student.id}-summary" style="display:none; font-size:14px; font-weight:700; color:#1e3a8a; text-transform:uppercase;">${window.SCHOOL_NAME}</span>
                                </div>
                            </div>

                            <!-- Metadata Card -->
                            <div style="display:grid; grid-template-columns: repeat(2, 1fr); gap:12px; background:#f8fafc; padding:15px; border-radius:8px; border:1px solid #e2e8f0; margin-bottom:25px; font-size:11px; color:#334155; line-height:1.5;">
                                <div>
                                    <p style="margin:2px 0;"><strong>Naam leerling:</strong> <span style="font-size:12px; font-weight:700; color:#1e293b;">${student.name}</span></p>
                                    <p style="margin:2px 0;"><strong>Leerlingnummer:</strong> ${student.student_number || '–'}</p>
                                    <p style="margin:2px 0;"><strong>Onderwijsinstelling:</strong> ${window.SCHOOL_NAME}</p>
                                    <p style="margin:2px 0;"><strong>Schooljaar / Klas:</strong> ${student.school_year || '–'} &nbsp;/&nbsp; ${student.class || '–'}</p>
                                </div>
                                <div>
                                    <p style="margin:2px 0;"><strong>Stagebedrijf:</strong> ${companyName}</p>
                                    <p style="margin:2px 0;"><strong>Praktijkopleider:</strong> ${supervisor?.name || '–'}</p>
                                    <p style="margin:2px 0;"><strong>Rapportageperiode:</strong> ${periodLabel}</p>
                                    <p style="margin:2px 0;"><strong>Afdrukdatum:</strong> ${printDate}</p>
                                </div>
                            </div>

                            <!-- Stats Summary Grid -->
                            <div style="margin-top:20px; margin-bottom:30px;">
                                <h3 style="font-size:12px; font-weight:700; color:#475569; text-transform:uppercase; margin:0 0 12px; letter-spacing:0.5px;">Geregistreerde resultaten</h3>
                                <div style="display:grid; grid-template-columns: repeat(5, 1fr); gap:10px; text-align:center;">
                                    <div style="background:#eff6ff; border:1.5px solid #bfdbfe; padding:12px 6px; border-radius:8px;">
                                        <span style="font-size:9px; color:#2563eb; font-weight:700; text-transform:uppercase; display:block; margin-bottom:4px;">Totaal Uren</span>
                                        <div style="font-size:18px; font-weight:800; color:#1d4ed8;">${totalHours} uur</div>
                                    </div>
                                    <div style="background:#f0fdf4; border:1.5px solid #bbf7d0; padding:12px 6px; border-radius:8px;">
                                        <span style="font-size:9px; color:#16a34a; font-weight:700; text-transform:uppercase; display:block; margin-bottom:4px;">Aanwezig</span>
                                        <div style="font-size:18px; font-weight:800; color:#15803d;">${stats.present} dgn</div>
                                    </div>
                                    <div style="background:#fef2f2; border:1.5px solid #fecaca; padding:12px 6px; border-radius:8px;">
                                        <span style="font-size:9px; color:#dc2626; font-weight:700; text-transform:uppercase; display:block; margin-bottom:4px;">Afwezig</span>
                                        <div style="font-size:18px; font-weight:800; color:#b91c1c;">${stats.absent} dgn</div>
                                    </div>
                                    <div style="background:#fff7ed; border:1.5px solid #fed7aa; padding:12px 6px; border-radius:8px;">
                                        <span style="font-size:9px; color:#ea580c; font-weight:700; text-transform:uppercase; display:block; margin-bottom:4px;">Ziek</span>
                                        <div style="font-size:18px; font-weight:800; color:#c2410c;">${stats.sick} dgn</div>
                                    </div>
                                    <div style="background:#fefce8; border:1.5px solid #fef08a; padding:12px 6px; border-radius:8px;">
                                        <span style="font-size:9px; color:#ca8a04; font-weight:700; text-transform:uppercase; display:block; margin-bottom:4px;">Te laat</span>
                                        <div style="font-size:18px; font-weight:800; color:#a16207;">${stats.late} dgn</div>
                                    </div>
                                </div>
                            </div>

                            <!-- Signatures Box -->
                            <div style="margin-top:60px; border-top:2px solid #cbd5e1; padding-top:25px; page-break-inside:avoid;">
                                <h3 style="font-size:12px; font-weight:700; color:#475569; text-transform:uppercase; margin:0 0 15px; letter-spacing:0.5px;">Officiële ondertekening</h3>
                                <p style="font-size:11px; color:#64748b; margin-bottom:30px; line-height:1.4;">
                                    Ondergetekenden verklaren hierbij dat de bovenstaande urenregistratie en aanwezigheidsstatistieken naar waarheid zijn ingevuld en gecontroleerd.
                                </p>
                                <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:25px; font-size:11px;">
                                    <div>
                                        <p style="font-weight:700; margin:0 0 35px 0; color:#334155;">1. Handtekening student</p>
                                        <div style="border-bottom:1px solid #94a3b8; height:20px; margin-bottom:6px;"></div>
                                        <p style="color:#64748b; margin:0;">Datum: ___________________</p>
                                    </div>
                                    <div>
                                        <p style="font-weight:700; margin:0 0 35px 0; color:#334155;">2. Handtekening praktijkopleider</p>
                                        <div style="border-bottom:1px solid #94a3b8; height:20px; margin-bottom:6px;"></div>
                                        <p style="color:#64748b; margin:0;">Datum: ___________________</p>
                                    </div>
                                    <div>
                                        <p style="font-weight:700; margin:0 0 35px 0; color:#334155;">3. Handtekening stagebegeleider</p>
                                        <div style="border-bottom:1px solid #94a3b8; height:20px; margin-bottom:6px;"></div>
                                        <p style="color:#64748b; margin:0;">Datum: ___________________</p>
                                    </div>
                                </div>
                            </div>

                            <!-- Footer disclaimer -->
                            <div style="margin-top:80px; text-align:center; font-size:9px; color:#94a3b8; border-top:1px solid #f1f5f9; padding-top:8px;">
                                Gegenereerd via StageConnectie &nbsp;·&nbsp; www.stageconnectie.nl &nbsp;·&nbsp; Document-ID: SC-DECL-${student.id.substring(0,8).toUpperCase()}
                            </div>
                        </div>

                        <!-- PAGINA 2: SPECIFICATIE STAGEDAGEN (DETAILOVERZICHT) -->
                        <div class="student-form-card" style="font-family:'Inter', sans-serif;">
                            <!-- School/Document Header -->
                            <div style="display:flex; justify-content:space-between; align-items:flex-start; border-bottom:3px solid #1e3a8a; padding-bottom:12px; margin-bottom:20px;">
                                <div>
                                    <h1 style="font-size:18px; font-weight:800; color:#1e3a8a; margin:0; text-transform:uppercase; letter-spacing:0.5px;">Specificatie Stagedagen</h1>
                                    <p style="font-size:11px; color:#475569; margin:4px 0 0; font-weight:500;">Dag-tot-dag specificatie van aanwezigheid en uren</p>
                                </div>
                                <div style="text-align:right;">
                                    <img src="${window.SCHOOL_LOGO}" onerror="this.style.display='none'; document.getElementById('school-text-fallback-${student.id}-spec').style.display='block';" style="max-height:48px; max-width:180px; object-fit:contain; display:block; margin-left:auto;">
                                    <span id="school-text-fallback-${student.id}-spec" style="display:none; font-size:14px; font-weight:700; color:#1e3a8a; text-transform:uppercase;">${window.SCHOOL_NAME}</span>
                                </div>
                            </div>

                            <!-- Student Info Summary line -->
                            <div style="background:#f8fafc; padding:8px 12px; border-radius:6px; border:1px solid #e2e8f0; margin-bottom:15px; font-size:11px; color:#334155; display:flex; justify-content:space-between;">
                                <span><strong>Leerling:</strong> ${student.name}</span>
                                <span><strong>Periode:</strong> ${periodLabel}</span>
                                <span><strong>Bedrijf:</strong> ${companyName}</span>
                            </div>

                            <!-- Table -->
                            <table class="student-form-table">
                                <thead>
                                    <tr>
                                        <th style="min-width:130px; font-size:11px;">Stagedag</th>
                                        <th style="min-width:140px; text-align:center; font-size:11px; background:#f1f5f9;">Ingevuld (app)</th>
                                        <th style="min-width:70px; text-align:center; font-size:11px; background:#f1f5f9;">Uren</th>
                                        <th style="min-width:140px; text-align:center; font-size:11px;">Verificatie Werkgever</th>
                                        <th style="min-width:100px; font-size:11px;">Handtekening/Paraaf</th>
                                    </tr>
                                </thead>
                                <tbody>${rows}</tbody>
                            </table>
                            
                            <!-- Footer disclaimer -->
                            <div style="margin-top:20px; text-align:center; font-size:9px; color:#94a3b8; border-top:1px solid #f1f5f9; padding-top:6px;">
                                Gegenereerd via StageConnectie &nbsp;·&nbsp; www.stageconnectie.nl &nbsp;·&nbsp; Document-ID: SC-SPEC-${student.id.substring(0,8).toUpperCase()}
                            </div>
                        </div>
                    `;
                }).join('');
            }

            // Toon print sectie
            document.getElementById('print-section').style.display = 'block';
            document.querySelector('main').style.display = 'none';
            document.querySelector('header').style.display = 'none';
        }

        function closePrintSection() {
            document.getElementById('print-section').style.display = 'none';
            document.querySelector('main').style.display = '';
            document.querySelector('header').style.display = '';
        }

        // Sluit modal bij klik buiten
        document.getElementById('edit-modal').addEventListener('click', function (e) {
            if (e.target === this) closeEditModal();
        });

        // Start
        init();
    </script>
</body>

</html>
