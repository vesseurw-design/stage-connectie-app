<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - StageConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="icon-v3.png">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-purple-50 to-indigo-50 min-h-screen">
    <nav class="bg-white/80 backdrop-blur-md shadow-sm border-b sticky top-0 z-10">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-2">
                    <img src="icon-v3.png" class="h-8 w-8 rounded-lg shadow-sm" alt="Logo">
                    <h1 class="text-xl font-bold text-gray-800">Mijn Stage</h1>
                </div>
                <button onclick="logout()"
                    class="text-sm font-medium text-red-500 hover:text-red-700 transition">Uitloggen</button>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
        <div id="loading" class="text-center py-12">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-purple-600 mx-auto"></div>
            <p class="mt-4 text-gray-500">Gegevens laden...</p>
        </div>

        <div id="content" class="hidden space-y-6">
            <!-- Header Card -->
            <div class="bg-white rounded-2xl shadow-xl p-6 border border-white/50">
                <h2 id="student-name" class="text-2xl font-bold text-gray-800">Welkom!</h2>
                <p id="student-info" class="text-gray-500 mt-1">Laden...</p>
            </div>

            <!-- Quick Action: Reporting for Today -->
            <div class="bg-white rounded-2xl shadow-xl p-6 border border-white/50">
                <h3 class="text-lg font-bold text-gray-800 mb-4">Vandaag: <span id="current-date"
                        class="text-purple-600"></span></h3>

                <!-- No Stage message block -->
                <div id="no-stage-block" class="hidden text-center py-6">
                    <div id="no-stage-icon" class="text-4xl mb-3">☕</div>
                    <h4 id="no-stage-title" class="text-lg font-bold text-gray-800 mb-2">Je hebt vandaag geen stage gepland staan.</h4>
                    <p id="no-stage-desc" class="text-gray-500 text-sm mb-6">Geniet van je dag! Loop je per uitzondering toch stage vandaag?</p>
                    <button onclick="showReportingBlock()" class="inline-flex items-center gap-2 text-purple-600 font-semibold hover:text-purple-800 transition bg-purple-50 hover:bg-purple-100 px-4 py-2 rounded-lg">
                        <span>Ik loop vandaag wel stage</span>
                    </button>
                </div>

                <!-- Actual Reporting block -->
                <div id="reporting-block">
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-6">
                        <button onclick="selectStatus('present')" id="btn-present"
                            class="status-btn p-4 rounded-xl border-2 border-gray-100 bg-gray-50 hover:bg-green-50 hover:border-green-200 transition text-center">
                            <span class="text-2xl block mb-1">✅</span>
                            <span class="text-sm font-bold text-gray-700">Aanwezig</span>
                        </button>
                        <button onclick="selectStatus('absent')" id="btn-absent"
                            class="status-btn p-4 rounded-xl border-2 border-gray-100 bg-gray-50 hover:bg-red-50 hover:border-red-200 transition text-center">
                            <span class="text-2xl block mb-1">❌</span>
                            <span class="text-sm font-bold text-gray-700">Afwezig</span>
                        </button>
                        <button onclick="selectStatus('late')" id="btn-late"
                            class="status-btn p-4 rounded-xl border-2 border-gray-100 bg-gray-50 hover:bg-yellow-50 hover:border-yellow-200 transition text-center">
                            <span class="text-2xl block mb-1">⏱️</span>
                            <span class="text-sm font-bold text-gray-700">Te laat</span>
                        </button>
                    </div>

                    <div id="hours-container" class="space-y-4">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Aantal uren stage gelopen:</label>
                            <div class="flex items-center gap-4">
                                <input type="number" id="hours-worked" step="0.5" min="0" max="24" value="0"
                                    class="w-24 px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-purple-500 outline-none transition text-lg font-bold">
                                <span class="text-gray-500 font-medium">uur</span>
                            </div>
                        </div>
                    </div>

                    <div class="mt-8">
                        <button onclick="saveReporting()" id="btn-save"
                            class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-4 rounded-xl shadow-lg hover:shadow-xl transition transform active:scale-95 flex justify-center items-center gap-2">
                            <span>Opslaan</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Recent History -->
            <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-white/50">
                <div class="p-6 border-b border-gray-100">
                    <h3 class="text-lg font-bold text-gray-800">Recente activiteit</h3>
                </div>
                <div id="attendance-history" class="divide-y divide-gray-50">
                    <!-- History items injected here -->
                </div>
            </div>
        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast"
        class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full shadow-2xl transition-all duration-300 opacity-0 pointer-events-none flex items-center gap-2 z-50">
        <span>✅ Opgeslagen</span>
    </div>

    <!-- Afwezig Modal -->
    <div id="absent-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl shadow-2xl p-6 max-w-md w-full transform scale-95 transition-transform duration-300" id="absent-modal-content">
            <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-red-100 mb-4">
                <span class="text-2xl">⚠️</span>
            </div>
            <h3 class="text-xl font-bold text-gray-900 mb-2 text-center">Afwezig gemeld</h3>
            <p class="text-sm text-gray-500 text-center mb-5">Vink elke stap aan voordat je verder kunt.</p>

            <div class="space-y-3 mb-6">
                <label id="label-check-1" class="flex items-start gap-3 p-3 rounded-xl border-2 border-gray-200 cursor-pointer transition hover:border-red-300 hover:bg-red-50">
                    <input type="checkbox" id="check-1" onchange="updateModalButton()" class="mt-0.5 h-5 w-5 accent-red-500 cursor-pointer flex-shrink-0">
                    <span class="text-sm font-medium text-gray-800">📞 Ik heb mijn stageplek gebeld om mijn afwezigheid door te geven.</span>
                </label>
                <label id="label-check-2" class="flex items-start gap-3 p-3 rounded-xl border-2 border-gray-200 cursor-pointer transition hover:border-red-300 hover:bg-red-50">
                    <input type="checkbox" id="check-2" onchange="updateModalButton()" class="mt-0.5 h-5 w-5 accent-red-500 cursor-pointer flex-shrink-0">
                    <span class="text-sm font-medium text-gray-800">💬 Ik heb een appje gestuurd naar mijn coach/stagebegeleider.</span>
                </label>
                <label id="label-check-3" class="flex items-start gap-3 p-3 rounded-xl border-2 border-gray-200 cursor-pointer transition hover:border-red-300 hover:bg-red-50">
                    <input type="checkbox" id="check-3" onchange="updateModalButton()" class="mt-0.5 h-5 w-5 accent-red-500 cursor-pointer flex-shrink-0">
                    <span class="text-sm font-medium text-gray-800">🏫 Mijn ouders hebben naar school gebeld voor ziekmelding.</span>
                </label>
            </div>

            <button id="confirm-absent-btn" onclick="closeAbsentModal()" disabled
                class="w-full bg-red-300 text-white font-bold py-3 px-4 rounded-xl transition shadow-md cursor-not-allowed opacity-60">
                Alles gedaan ✓
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./static/js/student-portal.js?v=2"></script>
</body>

</html>
